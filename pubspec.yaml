name: e_biotome
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0-alpha.9+9

environment:
  sdk: ^3.5.0

dependencies:
  cupertino_icons: ^1.0.8 
  modal_bottom_sheet: ^3.0.0
  material_floating_search_bar_2: ^0.5.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/PNGS/
    - assets/PNGS/CELL/
    - assets/PNGS/TISSUE/
    - assets/PNGS/CELL CYCLE/
    - assets/PNGS/CELL MEMBRANE/

  fonts:
    - family: LuckiestGuy
      fonts:
        - asset: assets/fonts/LuckiestGuy.ttf
    - family: CenturyGothic
      fonts:
        - asset: assets/fonts/GOTHIC.ttf